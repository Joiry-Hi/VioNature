# =============================================================================
#  VioNature gameplay tuning
# =============================================================================
#  Format: key = value
#  Unknown or invalid keys are ignored.
#  Booleans accept: true / false / 1 / 0 / yes / no / on / off.
# =============================================================================


# =============================================================================
#  1. Game mode & map selection
# =============================================================================

# Game mode: survival (waves + bosses) | duel (1vn AI duelist) | tutorial (no enemies, weapon tips)
game_mode = survival
tutorial_language = chinese  # tutorial text language: chinese | english

# Boss rush: when true, only bosses spawn at their scheduled times — no regular
# enemies, no scripted events, no boss support spawns.  No effect in duel mode.
boss_rush_mode = false

# Map type: circle | square_obstacle | square (alias) | asteroid | hollow_world | eden | labyrinth
map_type = labyrinth

# =============================================================================
#  2. Audio
# =============================================================================

# Global sound effect volume multiplier. 0 = mute, 1 = normal full volume.
# Can be changed at runtime from the console, e.g. set sfx_volume 0.35
sfx_volume = 0.3

# Main theme / background music. Set bgm_volume = 0 to mute.
# bgm_path can point to any supported streamed music file under assets/BGM.
# BGM fades out as the player moves away from the current world's surface.

bgm_path = assets/BGM/Strange New Blocks0.mp3
bgm_volume = 0.22
bgm_loop_gap = 8.0
bgm_altitude_fade_start = 8.0
bgm_altitude_fade_end = 500.0
bgm_altitude_min_volume = 0.2
bgm_back_world_volume = 0.1


