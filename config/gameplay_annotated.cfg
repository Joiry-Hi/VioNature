# =============================================================================
#  VioNature 游戏参数配置（中文标注版）
# =============================================================================
#  格式：key = value
#  注释：以 # 开头的行为注释，不影响游戏运行
#  布尔值：true / false / 1 / 0 / yes / no / on / off 均可
#  修改后重新启动游戏即可生效
#
#  !! 注意：如果文件无法保存，可能是从 zip 解压后带有只读属性。
#     右键点击文件 → 属性 → 取消勾选"只读" → 确定，即可用记事本编辑保存。
# =============================================================================


# =============================================================================
#  1. 游戏模式与地图选择
# =============================================================================

# 游戏模式  survival（生存：波次递增 + Boss 战）| duel（1v1 AI 决斗者）| tutorial（无敌人，切换武器时显示操作提示）
game_mode = duel
tutorial_language = chinese  # 教程语言  chinese | english

# Boss Rush：开启后仅 Boss 按各自时间生成，无小怪、无脚本事件、无 Boss 护卫。
# 对 duel 模式无影响。
boss_rush_mode = true

# 地图类型  circle | square_obstacle | square（别名）| asteroid | hollow_world | eden | labyrinth
map_type = circle

# =============================================================================
#  2. 音频
# =============================================================================

# 全局音效音量；0 = 静音，1 = 原始音量。
sfx_volume = 0.3

# 背景音乐。bgm_volume = 0 可静音；bgm_loop_gap 为单曲播完后到下一轮之间的间隔秒数。
# 玩家离当前世界地表越远，BGM 会按高度逐渐变小，制造飞离地表的空旷感。
# 进入里世界后会额外乘以 bgm_back_world_volume。
bgm_path = assets/BGM/Strange
bgm_volume = 0.22
bgm_loop_gap = 8.0
bgm_altitude_fade_start = 8.0
bgm_altitude_fade_end = 500.0
bgm_altitude_min_volume = 0.2
bgm_back_world_volume = 0.1


